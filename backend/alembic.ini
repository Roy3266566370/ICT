# Alembic configuration (C-MIGRATION@1).
#
# NOTE: configparser reads this file with the system locale encoding, so keep it
# ASCII-only. Human-readable Chinese notes live in alembic/env.py instead.
#
# Run from backend/:
#   python -m alembic upgrade head
#   python -m alembic current
#
# No connection string is stored here. alembic/env.py resolves it at runtime in
# this order:
#   1) config.set_main_option("sqlalchemy.url", ...) set by the caller
#   2) settings.migration_database_url (when non-empty)
#   3) settings.database_url (defaults to SQLite)
# Credentials therefore stay in environment variables / .env only.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S