# 象生 XiangSheng v0.2 —— 前端 nginx 站点配置
#
# 由 deploy/Dockerfile.frontend 复制到 /etc/nginx/conf.d/default.conf。
# 该文件只包含一个 server 块（conf.d 会被 nginx.conf 的 http {} 上下文 include）。
#
# 行为：
#   1. /            静态资源 + SPA fallback（try_files $uri /index.html）
#   2. /api/        反代到 backend:8000，保留 /api 前缀（后端路由是 /api/v1）
#   3. /fixtures/   构建产物 dist/fixtures/** 静态只读（不列表、不 fallback）
#   4. 安全响应头、gzip、上传体积上限
# 不包含任何密钥；本文件不读取 .env，镜像内也不存在 .env。

server {
    listen 80;
    server_name _;

    # 不对外暴露 nginx 版本号。
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 与后端 MAX_UPLOAD_BYTES=70MB 对齐，留出 multipart 头部开销。
    client_max_body_size 75m;

    # 关闭目录列表：任何路径只返回明确文件或 404。
    autoindex off;

    # gzip 只压文本类资源；图片/字体已压缩，不重复压。
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # 安全响应头放在 server 级；各 location 不再使用 add_header，
    # 以免 nginx 的"location 内 add_header 覆盖上层全部 add_header"规则丢失这些头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # ------------------------------------------------------------------
    # API 反代
    # proxy_pass 末尾不加斜杠：完整保留 /api/v1/... 的请求路径。
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Origin / Cookie 默认透传；后端据此做 CSRF 与 Origin 白名单校验。

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # 上传与长任务直接透传，不在 nginx 侧攒包。
        proxy_request_buffering off;
        proxy_buffering off;

        # API 响应一律不缓存（用 expires 避免 add_header 覆盖安全头）。
        expires off;
    }

    # ------------------------------------------------------------------
    # 夹具 JSON：vite build 时已 emit 到 dist/fixtures/**
    # 只返回真实文件，不 fallback 到 index.html，也不列目录。
    # ------------------------------------------------------------------
    location /fixtures/ {
        try_files $uri =404;
        expires -1;
    }

    # ------------------------------------------------------------------
    # 带哈希指纹的静态资源：长缓存
    # ------------------------------------------------------------------
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # index.html 每次协商，避免用户拿到旧入口。
    location = /index.html {
        try_files $uri =404;
        expires -1;
    }

    # ------------------------------------------------------------------
    # SPA fallback：前端使用 BrowserRouter，深链接全部交给 index.html。
    # 注意 /api/、/fixtures/、/assets/ 是更长的前缀匹配，不会被这里吞掉。
    # ------------------------------------------------------------------
    location / {
        try_files $uri /index.html;
    }

    # 禁止访问隐藏文件（.env、.git、.htaccess 等）。
    # 镜像里本来没有这些文件，这里是纵深防御，统一返回 404 不泄露存在性。
    location ~ /\. {
        return 404;
    }

}
