<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万象 · 个人主页 × 个人设置 融合设计原型（方案 A / 方案 B 对比）</title>
  <style>
    :root {
      --paper-bg: #f6f4ee;
      --paper-card: #fffdf8;
      --paper-pure: #ffffff;
      --paper-subtle: #f1ede3;
      --paper-warm: #ebe4d5;
      --ink-950: #141816;
      --ink-900: #1f2421;
      --ink-700: #3d4540;
      --ink-500: #66706a;
      --ink-400: #8e9690;
      --line: rgba(24, 28, 25, 0.10);
      --line-strong: rgba(24, 28, 25, 0.18);
      --cinnabar: #b84423;
      --cinnabar-soft: #fdf0eb;
      --indigo: #2e457a;
      --indigo-soft: #edf1fa;
      --teal: #116f68;
      --teal-soft: #eaf6f4;
      --gold: #9a6e24;
      --gold-soft: #fbf4e4;
      --font-serif: "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", Georgia, serif;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      --shadow-xs: 0 1px 2px rgba(24, 22, 16, 0.04);
      --shadow-sm: 0 2px 8px rgba(24, 22, 16, 0.05), 0 8px 22px rgba(24, 22, 16, 0.04);
      --shadow-md: 0 6px 18px rgba(24, 22, 16, 0.06), 0 18px 40px rgba(24, 22, 16, 0.06);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      font-family: var(--font-sans);
      color: var(--ink-900);
      background:
        radial-gradient(circle at 6% 8%, rgba(184, 68, 35, 0.05), transparent 34%),
        radial-gradient(circle at 94% 12%, rgba(46, 69, 122, 0.055), transparent 36%),
        var(--paper-bg);
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }

    /* ================= 顶部原型切换控制台 ================= */
    .proto-bar {
      position: sticky;
      top: 0;
      z-index: 90;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px 16px;
      padding: 9px clamp(14px, 3vw, 36px);
      background: #171b19;
      color: #f4efe3;
      font-size: 12.5px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .proto-left { display: flex; align-items: center; gap: 10px; }
    .proto-badge {
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.11);
      color: #e9cfa1;
      font: 600 11px var(--font-mono);
      letter-spacing: 0.04em;
    }
    .proto-controls { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
    .proto-seg {
      display: inline-flex;
      padding: 3px;
      border-radius: 9px;
      background: rgba(255, 255, 255, 0.08);
      gap: 2px;
    }
    .proto-seg button {
      border: 0;
      background: transparent;
      color: rgba(244, 239, 227, 0.72);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      transition: all 0.16s ease;
    }
    .proto-seg button:hover { color: #fff; }
    .proto-seg button.active {
      background: #fffdf8;
      color: #141816;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    .proto-tip { color: rgba(244, 239, 227, 0.6); font-size: 12px; }

    /* ================= 模拟万象主导航 ================= */
    .site-nav {
      position: sticky;
      top: 46px;
      z-index: 60;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 62px;
      padding: 0 clamp(16px, 3.5vw, 44px);
      background: rgba(246, 244, 238, 0.86);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-family: var(--font-serif);
      font-size: 19px;
      font-weight: 700;
      color: var(--ink-950);
      letter-spacing: 0.04em;
    }
    .nav-mark {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #1b2220, #36456c);
      color: #f8f2e4;
      display: grid;
      place-items: center;
      font: 700 14px var(--font-serif);
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .nav-link {
      padding: 6px 13px;
      border-radius: 8px;
      color: var(--ink-500);
      text-decoration: none;
      font-size: 13.5px;
      font-weight: 500;
    }
    .nav-link.current {
      color: var(--ink-950);
      background: rgba(20, 24, 22, 0.065);
      font-weight: 600;
    }
    .nav-account {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px 4px 4px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--paper-card);
      font-size: 13px;
      font-weight: 500;
    }

    /* ================= 公共组件与按钮 ================= */
    .container {
      width: min(1200px, calc(100% - clamp(24px, 5vw, 64px)));
      margin: 0 auto;
      padding: 26px 0 88px;
    }
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin: 0;
      font: 600 10.5px/1.4 var(--font-mono);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cinnabar);
    }
    .kicker.muted { color: var(--ink-500); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 36px;
      padding: 0 14px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.16s ease;
      white-space: nowrap;
      text-decoration: none;
    }
    .btn-primary {
      background: var(--ink-950);
      color: #fffdf8;
    }
    .btn-primary:hover { background: #2c3532; transform: translateY(-1px); }
    .btn-accent {
      background: var(--cinnabar);
      color: #fff;
    }
    .btn-accent:hover { background: #9e371a; }
    .btn-ghost {
      background: var(--paper-card);
      border-color: var(--line-strong);
      color: var(--ink-900);
    }
    .btn-ghost:hover { background: var(--paper-subtle); }
    .btn-soft {
      background: var(--paper-subtle);
      color: var(--ink-900);
    }
    .btn-soft:hover { background: var(--paper-warm); }
    .btn-sm { height: 30px; padding: 0 11px; font-size: 12px; border-radius: 7px; }
    .btn-danger-ghost {
      background: transparent;
      border-color: rgba(184, 68, 35, 0.28);
      color: #a33219;
    }
    .btn-danger-ghost:hover { background: #fdf0eb; }

    .avatar {
      display: grid;
      place-items: center;
      border-radius: 50%;
      font-family: var(--font-serif);
      font-weight: 700;
      color: #fffdf8;
      overflow: hidden;
      flex: none;
      position: relative;
      user-select: none;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .avatar-sm { width: 26px; height: 26px; font-size: 12px; }
    .avatar-lg { width: 74px; height: 74px; font-size: 28px; }
    .avatar-xl { width: 92px; height: 92px; font-size: 34px; }

    .avatar-editable { cursor: pointer; border: 0; padding: 0; background: none; position: relative; border-radius: 50%; }
    .avatar-editable .avatar-mask {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: rgba(20, 24, 22, 0.54);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      display: grid;
      place-items: center;
      opacity: 0;
      transition: opacity 0.18s ease;
    }
    .avatar-editable:hover .avatar-mask { opacity: 1; }

    .tag-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 12px;
      background: var(--paper-subtle);
      color: var(--ink-700);
      border: 1px solid rgba(24, 28, 25, 0.06);
    }
    .tag-remove {
      border: 0;
      background: none;
      color: var(--ink-400);
      padding: 0 2px;
      font-size: 14px;
      line-height: 1;
    }
    .tag-remove:hover { color: var(--cinnabar); }

    .card {
      background: var(--paper-card);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    /* ================= 4 套封面 / 名片氛围主题 ================= */
    .cover-surface {
      position: relative;
      overflow: hidden;
    }
    .cover-surface[data-theme="ivory-gold"] {
      background:
        radial-gradient(circle at 88% 20%, rgba(184, 68, 35, 0.14), transparent 45%),
        radial-gradient(circle at 14% 85%, rgba(154, 110, 36, 0.16), transparent 50%),
        linear-gradient(125deg, #f8f3e6 0%, #efe6d2 55%, #f4ecdb 100%);
      color: #252019;
    }
    .cover-surface[data-theme="indigo-star"] {
      background:
        radial-gradient(circle at 82% 24%, rgba(131, 232, 234, 0.24), transparent 42%),
        radial-gradient(circle at 20% 80%, rgba(255, 194, 103, 0.16), transparent 48%),
        linear-gradient(125deg, #171f3b 0%, #243866 56%, #18274a 100%);
      color: #f3f6ff;
    }
    .cover-surface[data-theme="chalk-board"] {
      background:
        radial-gradient(circle at 80% 30%, rgba(242, 201, 111, 0.18), transparent 44%),
        linear-gradient(125deg, #16332c 0%, #234c42 60%, #193830 100%);
      color: #f6f1e4;
    }
    .cover-surface[data-theme="oat-editorial"] {
      background:
        radial-gradient(circle at 85% 25%, rgba(116, 68, 46, 0.16), transparent 46%),
        linear-gradient(125deg, #efe2d0 0%, #e4d2bc 58%, #eadbc8 100%);
      color: #2f2621;
    }
    .cover-pattern {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      opacity: 0.35;
    }

    /* ================= 方案 A：Bento 便当盒展厅 ================= */
    .scheme-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }
    .scheme-header h1 {
      margin: 4px 0 0;
      font: 700 clamp(24px, 2.8vw, 31px)/1.18 var(--font-serif);
      color: var(--ink-950);
    }
    .scheme-tabs {
      display: inline-flex;
      padding: 4px;
      border-radius: 11px;
      background: var(--paper-subtle);
      border: 1px solid var(--line);
      gap: 4px;
    }
    .scheme-tabs button {
      border: 0;
      background: transparent;
      padding: 7px 15px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-500);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.16s ease;
    }
    .scheme-tabs button.active {
      background: var(--paper-pure);
      color: var(--ink-950);
      box-shadow: var(--shadow-xs);
    }
    .dirty-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--cinnabar);
      display: none;
    }
    .dirty-dot.show { display: inline-block; }

    .bento-grid {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 16px;
      align-items: stretch;
    }
    .bento-profile { grid-column: span 5; display: flex; flex-direction: column; }
    .bento-hero-pin { grid-column: span 7; display: flex; flex-direction: column; }
    .bento-stats { grid-column: span 4; display: flex; flex-direction: column; }
    .bento-recent { grid-column: span 4; display: flex; flex-direction: column; }
    .bento-prefs { grid-column: span 4; display: flex; flex-direction: column; }
    .bento-more-pins { grid-column: span 7; display: flex; flex-direction: column; }
    .bento-assets { grid-column: span 5; display: flex; flex-direction: column; }

    .bento-profile-banner {
      height: 92px;
      padding: 12px 16px;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
    }
    .bento-profile-body {
      padding: 0 22px 22px;
      margin-top: -36px;
      position: relative;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .bento-avatar-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .bento-avatar-ring {
      padding: 4px;
      background: var(--paper-card);
      border-radius: 50%;
      box-shadow: 0 6px 18px rgba(24, 22, 16, 0.12);
    }
    .profile-name {
      margin: 0;
      font: 700 26px/1.2 var(--font-serif);
      color: var(--ink-950);
    }
    .profile-handle {
      margin: 3px 0 0;
      font: 500 12.5px var(--font-mono);
      color: var(--ink-400);
    }
    .profile-meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 13px;
      color: var(--ink-700);
    }
    .meta-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--indigo-soft);
      color: var(--indigo);
      font-size: 12px;
      font-weight: 600;
    }
    .profile-bio {
      margin: 12px 0 14px;
      font-size: 13.5px;
      line-height: 1.7;
      color: var(--ink-700);
    }
    .profile-footer {
      margin-top: auto;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .profile-joined { font-size: 12px; color: var(--ink-400); }

    /* Bento Hero Pin (活态交互展柜) */
    .card-pad { padding: 20px 22px; display: flex; flex-direction: column; flex: 1; }
    .card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .card-title {
      margin: 2px 0 0;
      font: 700 18px/1.3 var(--font-serif);
      color: var(--ink-950);
    }
    .live-stage {
      position: relative;
      border-radius: 13px;
      background: linear-gradient(160deg, #161c2c 0%, #1d2740 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 14px 16px 12px;
      color: #f3f6ff;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .live-stage-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 12px;
      color: rgba(243, 246, 255, 0.78);
    }
    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 9px;
      border-radius: 999px;
      background: rgba(131, 232, 234, 0.14);
      color: #83e8ea;
      font: 600 11px var(--font-mono);
    }
    .live-pill i {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #83e8ea;
      box-shadow: 0 0 8px #83e8ea;
    }
    .fourier-canvas {
      width: 100%;
      height: 158px;
      display: block;
      border-radius: 8px;
      background: rgba(9, 13, 23, 0.5);
    }
    .live-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 12px;
    }
    .live-controls label {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 180px;
      color: rgba(243, 246, 255, 0.85);
    }
    .live-controls input[type="range"] {
      flex: 1;
      accent-color: #f0a756;
      cursor: pointer;
    }
    .live-controls strong {
      font-family: var(--font-mono);
      color: #ffd38e;
      min-width: 22px;
      text-align: right;
    }
    .stage-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .stage-caption p {
      margin: 2px 0 0;
      font-size: 12.5px;
      color: var(--ink-500);
    }

    /* Bento 创作画像 */
    .metric-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 8px 0 16px;
    }
    .metric-box {
      padding: 11px 10px;
      border-radius: 10px;
      background: var(--paper-subtle);
    }
    .metric-box strong {
      display: block;
      font: 700 24px/1.1 var(--font-serif);
      color: var(--ink-950);
    }
    .metric-box span {
      display: block;
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--ink-500);
    }
    .dist-bar {
      display: flex;
      height: 10px;
      border-radius: 999px;
      overflow: hidden;
      gap: 2px;
      margin-bottom: 10px;
    }
    .dist-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 12px;
      font-size: 12px;
      color: var(--ink-700);
    }
    .dist-legend span { display: inline-flex; align-items: center; gap: 5px; }
    .dist-legend i { width: 8px; height: 8px; border-radius: 2px; display: inline-block; }

    /* Bento 最近足迹 */
    .recent-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }
    .recent-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 10px;
      background: var(--paper-subtle);
      text-decoration: none;
      color: inherit;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    .recent-item:hover { background: var(--paper-warm); transform: translateX(2px); }
    .recent-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: grid;
      place-items: center;
      font-size: 14px;
      flex: none;
    }
    .recent-icon.deck { background: var(--cinnabar-soft); color: var(--cinnabar); }
    .recent-icon.work { background: var(--indigo-soft); color: var(--indigo); }
    .recent-icon.block { background: var(--teal-soft); color: var(--teal); }
    .recent-main { min-width: 0; flex: 1; }
    .recent-main strong {
      display: block;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .recent-main small { font-size: 11.5px; color: var(--ink-500); }
    .recent-foot {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }
    .text-link {
      color: var(--indigo);
      font-weight: 600;
      text-decoration: none;
      background: none;
      border: 0;
      padding: 0;
    }
    .text-link:hover { text-decoration: underline; }

    /* Bento 全站偏好摘要 */
    .pref-summary {
      display: flex;
      flex-direction: column;
      gap: 9px;
      flex: 1;
    }
    .pref-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 9px;
      background: var(--paper-subtle);
      font-size: 12.5px;
    }
    .pref-row span { color: var(--ink-500); }
    .pref-row strong {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--ink-900);
    }
    .swatch-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 1px solid rgba(0, 0, 0, 0.18);
      display: inline-block;
    }

    /* 更多精选卡片 */
    .pin-pair {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      flex: 1;
    }
    .pin-mini {
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--paper-pure);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .pin-mini:hover { transform: translateY(-2px); box-shadow: var(--shadow-sm); }
    .pin-thumb {
      height: 98px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .pin-thumb.slide-style {
      background: linear-gradient(135deg, #faf6ea, #ede4cf);
      color: #233a63;
    }
    .pin-thumb.sim-style {
      background: linear-gradient(135deg, #e7f3f1, #d5ebe7);
      color: #0e5852;
    }
    .pin-type-badge {
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.88);
      font-size: 11px;
      font-weight: 600;

    .modal-backdrop {

      inset: 0;
      z-index: 110;

    function renderSchemeB() {

    function renderNavAccount() {
      const chip = document.getElementById('nav-account-chip');
      if (!ui.auth) {
        chip.innerHTML = `<button type="button" class="btn btn-sm btn-primary" style="height:28px;" data-action="switch-auth">登录 / 注册</button>`;
        chip.style.border = '0';
        chip.style.padding = '0';
        chip.style.background = 'transparent';
        return;
      }
      chip.style.border = '';
      chip.style.padding = '';
      chip.style.background = '';
      chip.innerHTML = `${avatarHtml('avatar-sm', false)}<span>${esc(draft.displayName.trim() || draft.username)}</span>`;
    }

    function syncControlBar() {
      document.getElementById('btn-scheme-a').classList.toggle('active', ui.scheme === 'a');
      document.getElementById('btn-scheme-b').classList.toggle('active', ui.scheme === 'b');
      document.getElementById('btn-tab-showcase').classList.toggle('active', ui.tab === 'showcase');
      document.getElementById('btn-tab-settings').classList.toggle('active', ui.tab === 'settings');
      document.getElementById('btn-mode-auth').classList.toggle('active', ui.auth);
      document.getElementById('btn-mode-guest').classList.toggle('active', !ui.auth);
      document.getElementById('scheme-a-root').classList.toggle('hidden', ui.scheme !== 'a');
      document.getElementById('scheme-b-root').classList.toggle('hidden', ui.scheme !== 'b');
      document.getElementById('save-bar').classList.toggle('show', ui.auth && isDirty());
    }

    function renderAll(preserveFocusId = null, selStart = null, selEnd = null) {
      renderNavAccount();
      if (ui.scheme === 'a') renderSchemeA();
      else renderSchemeB();
      syncControlBar();
      bindDynamicEvents();
      drawFourierFrame();
      if (preserveFocusId) {
        const el = document.getElementById(preserveFocusId);
        if (el) {
          el.focus({ preventScroll: true });
          if (typeof selStart === 'number' && el.setSelectionRange) {
            try { el.setSelectionRange(selStart, selEnd ?? selStart); } catch {}
          }
        }
      }
    }

    /* ================= 交互事件绑定 ================= */
    function bindDynamicEvents() {
      document.querySelectorAll('[data-bind]').forEach((el) => {
        el.oninput = (e) => {
          const key = el.dataset.bind;
          draft[key] = e.target.value;
          renderAll(el.id, e.target.selectionStart, e.target.selectionEnd);
        };
        if (el.tagName === 'SELECT') {
          el.onchange = (e) => {
            draft[el.dataset.bind] = e.target.value;
            renderAll();
          };
        }
      });

      document.querySelectorAll('[data-bind-check]').forEach((el) => {
        el.onchange = (e) => {
          draft[el.dataset.bindCheck] = e.target.checked;
          renderAll();
        };
      });

      const tagInput = document.getElementById('f-tag-input');
      if (tagInput) {
        tagInput.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const val = tagInput.value.trim();
            if (!val) return;
            if (draft.interests.length >= 8) { showToast('兴趣标签最多添加 8 个'); return; }
            if (!draft.interests.includes(val)) {
              draft.interests = [...draft.interests, val];
              renderAll('f-tag-input');
            }
          }
        };
      }

      document.querySelectorAll('[data-fourier-slider]').forEach((slider) => {
        slider.oninput = (e) => {
          ui.harmonics = Number(e.target.value);
          document.querySelectorAll('[data-fourier-val]').forEach((v) => v.textContent = String(ui.harmonics));
          drawFourierFrame();
        };
      });
    }

    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'go-settings') { ui.tab = 'settings'; renderAll(); }
      else if (action === 'go-showcase') { ui.tab = 'showcase'; renderAll(); }
      else if (action === 'switch-auth') { ui.auth = true; renderAll(); showToast('已切换为已登录态'); }
      else if (action === 'pick-avatar') { document.getElementById('global-avatar-input').click(); }
      else if (action === 'clear-avatar') { draft.avatarUrl = null; renderAll(); showToast('已恢复默认文字头像'); }
      else if (action === 'pick-avatar-swatch') { draft.avatarUrl = null; draft.avatarSwatch = target.dataset.swatch; renderAll(); }
      else if (action === 'pick-cover') { draft.coverTheme = target.dataset.cover; renderAll(); }
      else if (action === 'pick-ppt-theme') { draft.defaultPptTheme = target.dataset.ppt; renderAll(); }
      else if (action === 'add-tag') {
        const tag = target.dataset.tag;
        if (draft.interests.length >= 8) { showToast('兴趣标签最多 8 个'); return; }
        if (!draft.interests.includes(tag)) { draft.interests = [...draft.interests, tag]; renderAll(); }
      }
      else if (action === 'remove-tag') {
        const tag = target.dataset.tag;
        draft.interests = draft.interests.filter((x) => x !== tag);
        renderAll();
      }
      else if (action === 'toggle-fourier-play') { ui.playing = !ui.playing; renderAll(); }
      else if (action === 'open-pin-modal') { openPinModal(); }
      else if (action === 'open-poster') { openPosterModal(); }
      else if (action === 'toast') { showToast(target.dataset.msg || '操作成功'); }
    });

    /* 顶部原型控制条 */
    document.getElementById('btn-scheme-a').onclick = () => { ui.scheme = 'a'; renderAll(); };
    document.getElementById('btn-scheme-b').onclick = () => { ui.scheme = 'b'; renderAll(); };
    document.getElementById('btn-tab-showcase').onclick = () => { ui.tab = 'showcase'; renderAll(); };
    document.getElementById('btn-tab-settings').onclick = () => { ui.tab = 'settings'; renderAll(); };
    document.getElementById('btn-mode-auth').onclick = () => { ui.auth = true; renderAll(); };
    document.getElementById('btn-mode-guest').onclick = () => { ui.auth = false; renderAll(); };

    /* 头像文件选择实时预览 */
    document.getElementById('global-avatar-input').onchange = (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      const reader = new FileReader();

        draft.avatarUrl = String(reader.result);
        renderAll();
        showToast('头像已更新（实时同步至名片与顶栏）');
      };
      reader.readAsDataURL(file);
    };

    /* 吸底保存/重置 */
    document.getElementById('btn-reset-draft').onclick = () => {
      draft = structuredClone(saved);
      renderAll();

    };
    document.getElementById('btn-save-draft').onclick = () => {
      if (!draft.displayName.trim()) { showToast('昵称不能为空'); return; }

      showToast('✓ 个人资料与全站偏好已保存');

    /* 置顶管理弹窗 */
    const pinModal = document.getElementById('pin-modal');
    function openPinModal() {
      const list = document.getElementById('pin-options-list');
      list.innerHTML = CATALOG_ITEMS.map((item) => `
        <label class="pin-option">
          <div>
            <strong style="display:block;font-size:13.5px;">${esc(item.title)}</strong>
            <small style="color:var(--ink-500);">${esc(item.kindLabel)} · ${esc(item.meta)}</small>

          <input type="checkbox" value="${item.id}" ${draft.pinnedIds.includes(item.id) ? 'checked' : ''} />
        </label>
      `).join('');
      pinModal.classList.add('open');
    }
    document.getElementById('btn-close-pin').onclick = () => pinModal.classList.remove('open');
    document.getElementById('btn-apply-pin').onclick = () => {
      const picked = [...pinModal.querySelectorAll('input:checked')].map((i) => i.value);
      if (!picked.length) { showToast('请至少选择 1 项展示作品'); return; }
      if (picked.length > 3) { showToast('最多置顶 3 项代表作'); return; }
      draft.pinnedIds = picked;
      pinModal.classList.remove('open');
      renderAll();
      showToast('置顶展柜已更新');
    };
    pinModal.onclick = (e) => { if (e.target === pinModal) pinModal.classList.remove('open'); };

    /* 名片海报导出弹窗 */
    const posterModal = document.getElementById('poster-modal');
    function openPosterModal() {
      drawPosterCanvas();
      posterModal.classList.add('open');
    }
    document.getElementById('btn-close-poster').onclick = () => posterModal.classList.remove('open');
    posterModal.onclick = (e) => { if (e.target === posterModal) posterModal.classList.remove('open'); };
    document.getElementById('btn-download-poster').onclick = () => {
      const url = document.getElementById('poster-canvas').toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url;
      a.download = `${(draft.displayName.trim() || 'wanxiang')}-创作者名片.png`;
      a.click();
      showToast('已下载高清 PNG 创作者名片');
    };

    function drawPosterCanvas() {
      const canvas = document.getElementById('poster-canvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width, h = canvas.height;
      const dark = draft.coverTheme === 'indigo-star' || draft.coverTheme === 'chalk-board';
      const bgColors = {
        'ivory-gold': ['#faf6ea', '#efe5cf'],
        'indigo-star': ['#171f3b', '#223663'],
        'chalk-board': ['#16332c', '#204a3f'],
        'oat-editorial': ['#f2e6d5', '#e4d3bc'],
      }[draft.coverTheme] || ['#faf6ea', '#efe5cf'];

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, bgColors[0]);
      grad.addColorStop(1, bgColors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // 装饰曲线
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(184,68,35,0.14)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= w; x += 8) {
        const y = h * 0.72 + Math.sin(x / 110) * 34 + Math.cos(x / 48) * 14;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // 品牌标
      ctx.fillStyle = dark ? '#ffd38e' : '#b84423';
      ctx.font = '600 18px ui-monospace, monospace';
      ctx.fillText('WANXIANG · 万象创作者名片', 64, 72);

      // 头像圆
      ctx.save();
      ctx.beginPath();
      ctx.arc(118, 178, 52, 0, Math.PI * 2);
      ctx.fillStyle = dark ? '#3c5aa0' : '#2e457a';
      ctx.fill();
      ctx.fillStyle = '#fffdf8';
      ctx.font = '700 42px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(Array.from(draft.displayName.trim() || '象')[0], 118, 180);
      ctx.restore();

      // 姓名与身份
      ctx.fillStyle = dark ? '#ffffff' : '#141816';
      ctx.font = '700 46px "Songti SC", Georgia, serif';
      ctx.fillText(draft.displayName.trim() || draft.username, 198, 172);
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.72)' : '#5a635e';
      ctx.font = '500 22px sans-serif';
      const meta = [draft.occupation.trim(), draft.school.trim(), '@' + draft.username].filter(Boolean).join(' · ');
      ctx.fillText(meta, 198, 214);

      // 简介
      ctx.fillStyle = dark ? 'rgba(255,255,255,0.88)' : '#323a35';
      ctx.font = '400 24px sans-serif';
      ctx.fillText((draft.bio.trim() || '探索动态教学与可视化创作').slice(0, 36), 64, 300);

      // 标签
      let tx = 64;
      ctx.font = '500 19px sans-serif';
      for (const tag of draft.interests.slice(0, 5)) {
        const label = '# ' + tag;
        const tw = ctx.measureText(label).width + 28;
        ctx.fillStyle = dark ? 'rgba(255,255,255,0.12)' : 'rgba(20,24,22,0.07)';
        ctx.beginPath();
        ctx.roundRect(tx, 344, tw, 38, 19);
        ctx.fill();
        ctx.fillStyle = dark ? '#eef4ff' : '#2c3430';
        ctx.fillText(label, tx + 14, 370);
        tx += tw + 12;
      }

      // 底部数据
      ctx.strokeStyle = dark ? 'rgba(255,255,255,0.14)' : 'rgba(20,24,22,0.12)';
      ctx.beginPath();
      ctx.moveTo(64, 456);
      ctx.lineTo(w - 64, 456);
      ctx.stroke();

      ctx.fillStyle = dark ? '#ffffff' : '#141816';
      ctx.font = '700 26px Georgia, serif';
      ctx.fillText('48 页动态幻灯片   ·   7 个交互沙盘   ·   5 块自研积木', 64, 514);
    }

    /* ================= 傅里叶实时波形动画 ================= */
    function drawFourierFrame() {
      const canvases = document.querySelectorAll('[data-fourier-canvas]');
      canvases.forEach((canvas) => {
        const rect = canvas.getBoundingClientRect();
        if (!rect.width) return;
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(rect.width * dpr);
        const h = Math.round(rect.height * dpr);
        if (canvas.width !== w || canvas.height !== h) {
          canvas.width = w;
          canvas.height = h;
        }
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, w, h);

        // 网格轴
        ctx.strokeStyle = 'rgba(255,255,255,0.08)';
        ctx.lineWidth = 1 * dpr;
        ctx.beginPath();
        ctx.moveTo(0, h / 2);
        ctx.lineTo(w, h / 2);
        ctx.stroke();

        // 目标方波参考线
        ctx.strokeStyle = 'rgba(131, 232, 234, 0.22)';
        ctx.setLineDash([5 * dpr, 5 * dpr]);
        ctx.beginPath();
        for (let px = 0; px <= w; px += 4) {
          const theta = (px / w) * Math.PI * 4 + ui.phase;
          const sq = Math.sin(theta) >= 0 ? 1 : -1;
          const py = h / 2 - sq * h * 0.30;
          if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
        ctx.setLineDash([]);

        // 傅里叶合成波形
        ctx.strokeStyle = '#f3b75c';
        ctx.lineWidth = 2.4 * dpr;
        ctx.beginPath();
        for (let px = 0; px <= w; px += 2) {
          const theta = (px / w) * Math.PI * 4 + ui.phase;
          let sum = 0;
          for (let n = 1; n <= ui.harmonics; n += 2) {
            sum += (4 / (Math.PI * n)) * Math.sin(n * theta);
          }
          const py = h / 2 - sum * h * 0.30;
          if (px === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
        ctx.stroke();
      });
    }

    function tick() {
      if (ui.playing && !draft.reducedMotion) {
        ui.phase += 0.025;
        drawFourierFrame();
      }
      requestAnimationFrame(tick);
    }

    renderAll();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
