<?xml version="1.0" encoding="UTF-8"?>
<!--
  象生 XiangSheng —— 主标志（mark）
  构成：开放方框（未闭合的「页」）+ 穿行曲线（叙事路径）+ 活跃圆点（可回应的参数点）
  颜色：--color-indigo #4F46E5（方框与曲线）、--color-coral #FF7A59（活跃圆点）
  可读性：viewBox 64×64，最小使用尺寸 24px（此时主描边等效约 2.25px，圆点直径约 4.5px）
  纯手写 path，不引用任何外部字体或位图。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 64 64"
  width="64"
  height="64"
  role="img"
  aria-labelledby="xs-mark-title"
>
  <title id="xs-mark-title">象生 XiangSheng 标志</title>

  <!-- 开放方框：右下角留出缺口，曲线从这里穿出 -->
  <path
    d="M10 54 V10 H54 V38"
    fill="none"
    stroke="#4F46E5"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 穿行曲线：从方框内部出发，穿过缺口继续向外延伸 -->
  <path
    d="M14 46 C 24 46 26 30 36 30 S 48 40 54 22"
    fill="none"
    stroke="#4F46E5"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    opacity="0.92"
  />

  <!-- 活跃圆点：曲线的终点，强调「这一页可以被回应」 -->
  <circle cx="54" cy="22" r="6" fill="#FF7A59" />
</svg>