<?xml version="1.0" encoding="UTF-8"?>
<!--
  象生 XiangSheng —— 组合标志（lockup：符号 + 中英文标准字）

  字体说明（重要）：
  - 本文件刻意使用 <text> + 通用字体栈，**不引用任何外部字体文件**，保证离线可用：
      中文：'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif
      英文：Inter, 'Segoe UI', system-ui, sans-serif
  - 若用于印刷、字体定制或需要像素级稳定的场景，请把 <text> 转为轮廓路径（转曲）：
      Illustrator：文字 → 创建轮廓；Inkscape：路径 → 对象转路径（Ctrl+Shift+C）。
    转曲后视觉一致，且不依赖客户端字体，适合作为正式品牌资产分发。
  - 标准字比例：中文 26px / 字重 600；英文 14px / 字距 2px / 颜色 --color-navy-muted。
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 344 72"
  width="344"
  height="72"
  role="img"
  aria-labelledby="xs-lockup-title"
>
  <title id="xs-lockup-title">象生 XiangSheng</title>

  <!-- 符号：logo-mark.svg 等比缩放到 56×56，左上角对齐 -->
  <g transform="translate(4 8) scale(0.875)">
    <path
      d="M10 54 V10 H54 V38"
      fill="none"
      stroke="#4F46E5"
      stroke-width="6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M14 46 C 24 46 26 30 36 30 S 48 40 54 22"
      fill="none"
      stroke="#4F46E5"
      stroke-width="4.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.92"
    />
    <circle cx="54" cy="22" r="6" fill="#FF7A59" />
  </g>

  <!-- 中文标准字 -->
  <text
    x="76"
    y="36"
    fill="#0A1A33"
    font-family="'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif"
    font-size="26"
    font-weight="600"
    letter-spacing="2"
  >象生</text>

  <!-- 英文标准字 -->
  <text
    x="77"
    y="58"
    fill="#4B5B74"
    font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif"
    font-size="14"
    font-weight="500"
    letter-spacing="2"
  >XiangSheng</text>
</svg>