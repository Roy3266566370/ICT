components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: xs_session
      description: 服务端下发的 HttpOnly 访客会话 Cookie；原始凭据不得写入 localStorage（R2-AC1）。
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: 必须等于当前会话 csrf_token；写请求（除 POST /sessions）还必须校验 Origin 在允许列表内（R13-AC4、§2.2.7 契约级行为 2）。
    authCookie:
      type: apiKey
      in: cookie
      name: xs_auth
      description: 账号会话 Cookie（HttpOnly；库内只存 SHA-256 摘要，明文只下发一次）。与访客 sessionCookie 相互独立（R11-6）。

  headers:
    XRequestId:
      description: 与响应体 request_id 相同，便于前后端对齐排障
      schema:
        type: string
        pattern: '^[0-9a-f]{16}$'

  parameters:
    MaterialId:
      name: material_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ObjectId:
      name: object_id
      in: path
      required: true
      schema:
        type: string
        minLength: 1

  responses:
    SuccessSessionInfo:
      description: 当前会话
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ApiSuccess'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/SessionInfo'
    Error400:
      description: 参数或文件不合法（INVALID_FILE）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401:
      description: 会话无效或过期（SESSION_EXPIRED）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error404:
      description: 资源不存在或不属于当前会话；body 仍为 ApiError，code=SESSION_EXPIRED、message=资源不可用（§2.2.8 末段、§2.3.7 D2）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409:
      description: 版本冲突（VERSION_CONFLICT）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error413:
      description: 超出文件/页数/解压限制（LIMIT_EXCEEDED）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error422:
      description: 缺字段/越界/非法引用/循环依赖/规模超限/不支持的模板（MISSING_FIELD 或 UNSUPPORTED_TEMPLATE）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error503:
      description: 规则化候选生成器不可用（MODEL_UNAVAILABLE）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error401Auth:
      description: 账号未登录、会话无效或凭据不匹配（AUTH_REQUIRED / INVALID_CREDENTIALS）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error403:
      description: 账号不可用（FORBIDDEN）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Error409Email:
      description: 用户名或邮箱已注册（USERNAME_ALREADY_REGISTERED / EMAIL_ALREADY_REGISTERED）；既有 Error409 保持 VERSION_CONFLICT 语义不变
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    RequestId:
      type: string
      pattern: '^[0-9a-f]{16}$'
      description: 后端生成的请求标识（uuid4().hex[:16]）

    ApiSuccess:
      type: object
      additionalProperties: false
      required: [data, request_id]
      description: 成功响应外壳；204 无体除外（§2.2.7 契约级行为 1）。
      properties:
        data:
          description: 业务载荷，形状由各端点覆盖定义
        request_id:
          $ref: '#/components/schemas/RequestId'

    ErrorCode:
      type: string
      description: |
        错误码枚举（C-ERR@1，§2.2.8）。HTTP 与 retryable 映射：
        INVALID_FILE 400/false；LIMIT_EXCEEDED 413/false；PARSE_FAILED 422/true；
        MODEL_UNAVAILABLE 503/true；UNSUPPORTED_TEMPLATE 422/false；
        MISSING_FIELD 422/false；VERSION_CONFLICT 409/false；SESSION_EXPIRED 401/false。
        C-ERR@2 追加：AUTH_REQUIRED 401/false；INVALID_CREDENTIALS 401/false；
        EMAIL_ALREADY_REGISTERED 409/false；FORBIDDEN 403/false；
        EMAIL_NOT_VERIFIED 403/false；RATE_LIMITED 429/false。
        C-ERR@3 追加：USERNAME_ALREADY_REGISTERED 409/false。
        AUTH_REQUIRED/INVALID_CREDENTIALS/EMAIL_ALREADY_REGISTERED/USERNAME_ALREADY_REGISTERED/FORBIDDEN 由账号端点产生；
        EMAIL_NOT_VERIFIED 与 RATE_LIMITED 为保留值，本版本不产生。
      enum:
        - INVALID_FILE
        - LIMIT_EXCEEDED
        - PARSE_FAILED
        - MODEL_UNAVAILABLE
        - UNSUPPORTED_TEMPLATE
        - MISSING_FIELD
        - VERSION_CONFLICT
        - SESSION_EXPIRED
        - AUTH_REQUIRED
        - INVALID_CREDENTIALS
        - EMAIL_ALREADY_REGISTERED
        - FORBIDDEN
        - EMAIL_NOT_VERIFIED
        - RATE_LIMITED
        - USERNAME_ALREADY_REGISTERED

    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, retryable]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          description: 面向用户的中文说明，不含堆栈与密钥（R12-AC5）
        retryable:
          type: boolean
          description: 是否建议重试；PARSE_FAILED 与 MODEL_UNAVAILABLE 为 true
        details:
          type: object
          additionalProperties: true
          description: 可选结构化细节，如越界字段名与允许范围

    ApiError:
      type: object
      additionalProperties: false
      required: [error, request_id]
      description: 统一错误外壳；request_id 位于顶层（§2.2.7 的 TS 声明 ApiError），与成功响应保持一致。
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
        request_id:
          $ref: '#/components/schemas/RequestId'

    TemplateId:
      type: string
      enum: [matrix_2d, force_2d, bfs_flow, budget_compare]

    SessionInfo:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, csrf_token, retention_hours]
      properties:
        session_id:
          type: string
          minLength: 1
        expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          minLength: 1
          description: 写请求必须放入 X-CSRF-Token
        retention_hours:
          type: integer
          minimum: 1
          description: 访客材料默认保留小时数，首版固定 24（R2-AC5）

    TemplateDescriptor:
      type: object
      additionalProperties: false
      required: [template_id, name, scenario_slug, kernel_version, validation_profile, example_id, limits, schema_path]
      properties:
        template_id:
          $ref: '#/components/schemas/TemplateId'
        name:
          type: string
          minLength: 1
          description: 场景卡名称，固定为「空间与矩阵」「力与向量」「计算机过程」「办公推演」
        scenario_slug:
          type: string
          enum: [matrix, force, bfs, budget]
        kernel_version:
          type: string
          enum: [linear_v1, force_v1, bfs_v1, budget_v1]
        validation_profile:
          type: string
          minLength: 1
        example_id:
          type: string
          minLength: 1
          description: 对应 fixtures/examples/index.json 的 example_id
        limits:
          type: object
          additionalProperties:
            type: string
          description: 面向用户的限制说明，如 {"页数":"60","文件大小":"70MB"}
        schema_path:
          type: string
          description: 调试用 schema 位置，如 contracts/schemas/template_matrix_2d.schema.json（不是 /api/v1/templates/{id}/schema 端点，见 contracts/README.md 契约矛盾 C-01）

    CloneResult:
      type: object
      additionalProperties: false
      required: [material_id, object_id]
      properties:
        material_id:
          type: string
          minLength: 1
        object_id:
          type: string
          minLength: 1

    UploadAccepted:
      type: object
      additionalProperties: false
      required: [material_id, job_id]
      properties:
        material_id:
          type: string
          minLength: 1
        job_id:
          type: string
          minLength: 1

    RetryAccepted:
      type: object
      additionalProperties: false
      required: [job_id, attempt]
      properties:
        job_id:
          type: string
          minLength: 1
        attempt:
          type: integer
          minimum: 1
          description: 重试后的新 attempt 序号

    CompileAccepted:
      type: object
      additionalProperties: false
      required: [job_id]
      properties:
        job_id:
          type: string
          minLength: 1

    MaterialStatus:
      type: string
      enum: [processing, awaiting_confirmation, ready, failed]

    MaterialSummary:
      type: object
      additionalProperties: false
      required: [material_id, title, status, page_count, created_at, expires_at, object_count]
      properties:
        material_id:
          type: string
          minLength: 1
        title:
          type: string
        status:
          $ref: '#/components/schemas/MaterialStatus'
        page_count:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        object_count:
          type: integer
          minimum: 0
        template_id:
          type: string
          enum: [matrix_2d, force_2d, bfs_flow, budget_compare]
          description: |
            P1 可选追加（向后兼容，未改 required、未升版本号）：该材料最终确认的知识对象模板，
            供空间页与示例卡直接展示场景归属，无需再请求 /objects/{id}。
            处理中（processing/awaiting_confirmation）或未识别出模板时省略该键。
        run_count:
          type: integer
          minimum: 0
          description: |
            P1 可选追加（向后兼容，未改 required、未升版本号）：该材料下所有对象的运行快照总数，
            供空间页显示"已保存 N 次运行"。尚未统计或数据不可用时省略该键（不得返回伪造的 0）。

    MaterialList:
      type: object
      additionalProperties: false
      required: [items, retention_expires_at]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSummary'
        retention_expires_at:
          type: string
          format: date-time
          description: 当前会话材料的统一保留到期时间

    SlideElement:
      type: object
      additionalProperties: false
      required: [element_id, kind, name, bbox, text, asset_id]
      properties:
        element_id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [text, picture, shape, chart, table, group]
        name:
          type: string
        bbox:
          type: object
          additionalProperties: false
          required: [x, y, w, h]
          description: EMU 绝对坐标；来源只有页级信息时整条 SourceRef.bbox 为 null，不渲染元素框（R4-AC3）
          properties:
            x:
              type: number
            y:
              type: number
            w:
              type: number
            h:
              type: number
        text:
          type: [string, 'null']
        asset_id:
          type: [string, 'null']

    SlidePage:
      type: object
      additionalProperties: false
      required: [page_no, title, paragraphs, elements, excerpt, image_url]
      properties:
        page_no:
          type: integer
          minimum: 1
          description: 1-based 页码
        title:
          type: string
        paragraphs:
          type: array
          items:
            type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/SlideElement'
        excerpt:
          type: string
        image_url:
          type: [string, 'null']
          description: 当前材料的整页预览 URL；无整页图时为 null，按页面结构降级阅读
        width:
          type: number
          description: 原始页面宽度，单位 EMU
        height:
          type: number
          description: 原始页面高度，单位 EMU

    CandidateObject:
      type: object
      additionalProperties: false
      required: [candidate_id, template_id, confidence_hint, fields]
      properties:
        candidate_id:
          type: string
          minLength: 1
        template_id:
          $ref: '#/components/schemas/TemplateId'
        confidence_hint:
          type: string
          enum: [low, medium]
        fields:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [parameter_id, name, status]
            properties:
              parameter_id:
                type: string
                minLength: 1
              name:
                type: string
              status:
                type: string
                enum: [present, missing, inferred]

    JobStage:
      type: string
      description: 任务状态机；只允许 queued → parsing → rendering → extracting → awaiting_confirmation → compiling → validating → ready | failed（R3-AC3）。
      enum:
        - queued
        - parsing
        - rendering
        - extracting
        - awaiting_confirmation
        - compiling
        - validating
        - ready
        - failed

    JobStatus:
      type: object
      additionalProperties: false
      required: [job_id, material_id, kind, stage, attempt, progress_pct, error, updated_at]
      properties:
        job_id:
          type: string
          minLength: 1
        material_id:
          type: string
          minLength: 1
        kind:
          type: string
          enum: [upload, compile, validate]
        stage:
          $ref: '#/components/schemas/JobStage'
        attempt:
          type: integer
          minimum: 1
        progress_pct:
          type: [integer, 'null']
          minimum: 0
          maximum: 100
          description: 仅可计量阶段给出；rendering 阶段为 null，不编造百分比（§2.3.5）
        error:
          type: [object, 'null']
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              $ref: '#/components/schemas/ErrorCode'
            message:
              type: string
        updated_at:
          type: string
          format: date-time

    MaterialDetail:
      type: object
      additionalProperties: false
      required: [material, slides, objects, candidates, job]
      properties:
        ispecs:
          type: array
          items:
            $ref: './spec/ispec.schema.json'
        render:
          type: object
          description: 整页渲染引擎、保真度、状态和错误摘要
        material:
          $ref: '#/components/schemas/MaterialSummary'
        slides:
          type: array
          items:
            $ref: '#/components/schemas/SlidePage'
        objects:
          type: array
          items:
            $ref: './schemas/knowledge_object.schema.json'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/CandidateObject'
        job:
          oneOf:
            - type: 'null'
            - $ref: '#/components/schemas/JobStatus'

    ObjectEnvelope:
      type: object
      additionalProperties: false
      required: [object]
      properties:
        object:
          $ref: './schemas/knowledge_object.schema.json'

    ObjectWithChecks:
      type: object
      additionalProperties: false
      required: [object, checks_summary]
      properties:
        object:
          $ref: './schemas/knowledge_object.schema.json'
        checks_summary:
          oneOf:
            - type: 'null'
            - $ref: './schemas/run.schema.json#/$defs/ValidationReport'

    RunList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './schemas/run.schema.json'

    CheckList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: './schemas/run.schema.json#/$defs/ValidationReport'

    PutModelRequest:
      type: object
      additionalProperties: false
      required: [expected_version, object]
      description: PUT /objects/{id}/model 的请求体；expected_version 与库中 model_version 不一致返回 VERSION_CONFLICT（R10-AC6）。
      properties:
        expected_version:
          type: integer
          minimum: 1
        object:
          $ref: './schemas/knowledge_object.schema.json'

    CompileRequest:
      type: object
      additionalProperties: false
      required: [model_version]
      properties:
        model_version:
          type: integer
          minimum: 1

    CreateRunRequest:
      type: object
      additionalProperties: false
      required: [model_version, revision, input_snapshot]
      description: result 为可选入参（客户端本地展示结果，仅用于对比）；服务端必定用内核重算并覆盖。
      properties:
        model_version:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 0
        input_snapshot:
          $ref: './schemas/knowledge_object.schema.json'
        result:
          description: 客户端本地计算结果，服务端忽略并在响应中返回重算结果

    ValidateRequest:
      type: object
      additionalProperties: false
      required: [model_version, revision]
      properties:
        model_version:
          type: integer
          minimum: 1
        revision:
          type: integer
          minimum: 0
    AuthUser:
      type: object
      additionalProperties: false
      required: [user_id, username, email, display_name, status, created_at, email_verification]
      description: 注册 / 登录 / GET /me 共用的账号展示对象（C-AUTHAPI@1）。
      properties:
        user_id:
          type: string
          pattern: '^usr_[0-9a-f]{32}$'
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 用户名的原始展示值（大小写与注册时一致）；老账号回退为邮箱本地部分
        email:
          type: string
          minLength: 1
          description: login_identities.display_identifier（原始展示值，不做大小写改写）
        display_name:
          type: string
          maxLength: 64
        status:
          type: string
          enum: [active]
        created_at:
          type: string
          format: date-time
        email_verification:
          type: string
          enum: [disabled_development]
          description: 开发期降级标记；本版本不实现邮箱验证，注册即 active

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password]
      description: POST /api/v1/auth/register 的请求体（C-AUTHAPI@1 ①）。
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 20
          description: 3–20 个字符；首字符为字母，其余为字母、数字、下划线或短横线；不区分大小写唯一
        email:
          type: string
          minLength: 3
          maxLength: 320
          description: 必填，用于登录与后续通知；不发送验证邮件
        password:
          type: string
          minLength: 1
          maxLength: 128
          description: 业务策略要求 8–128 个字符，违规返回 422 MISSING_FIELD
        display_name:
          type: [string, 'null']
          maxLength: 64

    LoginRequest:
      type: object
      additionalProperties: false
      required: [password]
      description: POST /api/v1/auth/login 的请求体（C-AUTHAPI@1 ②）；identifier 与 email 至少提供一个，前者优先。
      properties:
        identifier:
          type: string
          minLength: 1
          maxLength: 320
          description: 用户名或邮箱
        email:
          type: string
          minLength: 1
          maxLength: 320
          description: 旧客户端兼容字段；新客户端使用 identifier
        password:
          type: string
          minLength: 1
          maxLength: 128
        remember:
          type: boolean
          default: false
          description: true 时空闲窗口 168h、绝对窗口 720h

    LoginResult:
      type: object
      additionalProperties: false
      required: [user, csrf_token, expires_at, absolute_expires_at]
      description: POST /api/v1/auth/login 的 data（C-AUTHAPI@1 ②）。
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        csrf_token:
          type: string
          minLength: 1
          description: 当前会话 CSRF；只用于 X-CSRF-Token，不得写入 URL 或 localStorage
        expires_at:
          type: string
          format: date-time
          description: 等于 idle_expires_at
        absolute_expires_at:
          type: string
          format: date-time

    AuthSessionSummary:
      type: object
      additionalProperties: false
      required: [session_id, expires_at, idle_expires_at]
      description: GET /api/v1/me 中的会话摘要；expires_at 与 idle_expires_at 同值。
      properties:
        session_id:
          type: string
          pattern: '^aut_[0-9a-f]{32}$'
        expires_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time

    MeResponse:
      type: object
      additionalProperties: false
      required: [user, session, csrf_token]
      description: GET /api/v1/me 的 data（C-AUTHAPI@1 ④）。
      properties:
        user:
          $ref: '#/components/schemas/AuthUser'
        session:
          $ref: '#/components/schemas/AuthSessionSummary'
        csrf_token:
          type: string
          minLength: 1
