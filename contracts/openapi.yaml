# 万象 WANXIANG v0.2 —— /api/v1 接口契约（C-API@1 + C-ERR@1）
#
# 唯一设计源：.codeartsdoer/plans/xiangsheng-v0.2/plan.md §2.2.7（端点与请求/响应体）、§2.2.8（错误码）。
# 字段名与 §2.2 的 TS 声明逐字一致（snake_case），不做自动命名转换。
# 领域对象复用 contracts/schemas/ 下的 JSON Schema 文件，避免第二份真源。
#
# 覆盖范围：§2.2.7 表格的 19 个端点，分布在 16 个 path 条目（/materials、/materials/{material_id}、
# /objects/{object_id}/runs 三个路径各含 2 个方法）。
#
# 统一封装：
#   成功  { "data": <T>, "request_id": "<16 hex>" }
#   错误  { "error": { "code": <ErrorCode>, "message": "...", "retryable": bool, "details": {...} }, "request_id": "..." }
#   request_id 同时回写到响应头 X-Request-Id。

openapi: 3.1.0

info:
  title: 万象 WANXIANG API
  version: 0.2.0
  description: |
    个人工作空间的首版接口契约：访客会话、材料上传与后台任务状态机、知识对象/版本/运行/校验、
    四个白名单模板（matrix_2d / force_2d / bfs_flow / budget_compare）。

    契约级行为（§2.2.7）：
    1. 所有成功响应都必须包 data，204 除外；request_id 由后端生成（uuid4().hex[:16]）并在响应头 X-Request-Id 回写。
    2. 写请求（除 POST /sessions）必须携带 X-CSRF-Token 等于当前会话 csrf_token，且 Origin 在允许列表内。
    3. POST /objects/{id}/runs 的 result 为可选入参，服务端必须用内核重算并覆盖，响应里的 result 永远是服务端结果。
    4. POST /objects/{id}/validate 首版同步执行并返回报告，不建 job；GET /objects/{id}/checks 返回历史报告，is_stale 在响应时按当前对象版本动态计算。
    5. 分页用 limit，默认 20、最大 50；超出按 50 处理，不报错。
    6. GET /materials/{id}/assets/{asset_id} 必须校验 asset_id 属于该 material；禁止路径拼接直接读文件。
    7. 归属校验失败统一返回 404，body 为 ApiError 且 code="SESSION_EXPIRED"、message="资源不可用"（§2.2.8 末段、§2.3.7 D2）。

servers:
  - url: /
    description: 同源部署（frontend 与 backend 由 nginx 反代到同一 origin）

tags:
  - name: sessions
    description: 访客会话与 CSRF
  - name: templates
    description: 模板白名单与描述
  - name: examples
    description: 手工示例克隆
  - name: materials
    description: 材料上传、列表、详情、删除、受鉴权资源
  - name: jobs
    description: 后台任务状态与重试
  - name: objects
    description: 知识对象、模型版本、编译、运行、校验
  - name: runs
    description: 历史运行快照
  - name: auth
    description: 账号注册、登录与退出（C-AUTHAPI@1 ①–③）
  - name: me
    description: 当前账号与会话摘要（C-AUTHAPI@1 ④）
  - name: ppt-ai
    description: PPT AI 交互规划、补充实验、目标反求、自动验收与专用视图（ppt-ai.1）
  - name: trust
    description: 可信溯源、参数确认与“AI 说错了”对抗演示
  - name: projects
    description: 可再次编辑的 .xsproj 工程包

security:
  - sessionCookie: []

paths:
  /api/v1/sessions:
    post:
      tags: [sessions]
      operationId: createSession
      summary: 创建访客会话（端点 #1）
      description: 空体；服务端创建访客会话并下发 HttpOnly Cookie，返回 session_id / expires_at / csrf_token / retention_hours。原始凭据不得写入 localStorage（R2-AC1）。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: 会话已创建
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/SessionInfo'

  /api/v1/sessions/current:
    get:
      tags: [sessions]
      operationId: getCurrentSession
      summary: 读取当前会话（端点 #2）
      description: 返回 session_id / expires_at / csrf_token；SessionInfo 另含 retention_hours（向后兼容超集，见 contracts/README.md 契约矛盾 C-02）。
      responses:
        '200':
          $ref: '#/components/responses/SuccessSessionInfo'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/templates:
    get:
      tags: [templates]
      operationId: listTemplates
      summary: 模板白名单列表（端点 #3）
      description: 返回四个 TemplateDescriptor；前端据此渲染场景卡并校验 template_id 白名单（R12-AC3）。
      security: []
      responses:
        '200':
          description: 模板列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TemplateDescriptor'

  /api/v1/examples/{example_id}/clone:
    post:
      tags: [examples]
      operationId: cloneExample
      summary: 克隆手工示例到当前会话（端点 #4）
      description: 空体；在当前会话中克隆该手工示例副本，副本标注 provenance=manual_demo，不冒充解析结果（R2-AC6）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - name: example_id
          in: path
          required: true
          description: fixtures/examples/index.json 中的 example_id
          schema:
            type: string
            minLength: 1
      responses:
        '201':
          description: 克隆完成
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CloneResult'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/materials:
    post:
      tags: [materials]
      operationId: uploadMaterial
      summary: 上传 PPTX 并建任务（端点 #5）
      description: multipart/form-data，字段名 file。校验扩展名、ZIP 结构、单文件 70MB、60 页上限（R3-AC1）；宏/加密/损坏/路径越界拒绝（R3-AC2）。
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: .pptx 文件，<= 70MB
      responses:
        '202':
          description: 已受理，任务排队中
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadAccepted'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '413':
          $ref: '#/components/responses/Error413'
    get:
      tags: [materials]
      operationId: listMaterials
      summary: 材料列表（端点 #6）
      description: 返回当前会话的材料与保留到期时间（默认 24 小时，R2-AC5）。
      parameters:
        - name: limit
          in: query
          required: false
          description: 分页条数，默认 20，最大 50；超出按 50 处理不报错
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: 材料列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MaterialList'
        '401':
          $ref: '#/components/responses/Error401'

  /api/v1/materials/{material_id}:
    get:
      tags: [materials]
      operationId: getMaterial
      summary: 材料详情（端点 #7）
      description: 含 slides / objects / candidates / job；awaiting_confirmation 阶段返回可读原文与候选对象（R3-AC6）。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '200':
          description: 材料详情
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MaterialDetail'
        '404':
          $ref: '#/components/responses/Error404'
    delete:
      tags: [materials]
      operationId: deleteMaterial
      summary: 删除材料（端点 #8）
      description: 立即令其资源不可访问并返回 204 无体（R2-AC4）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/MaterialId'
      responses:
        '204':
          description: 已删除，无响应体
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/materials/{material_id}/assets/{asset_id}:
    get:
      tags: [materials]
      operationId: getMaterialAsset
      summary: 受鉴权的图片资源（端点 #9）
      description: 返回 png/jpeg 二进制；必须校验 asset_id 属于该 material，禁止路径拼接直接读文件（§2.2.7 契约级行为 6）。素材指向 fixtures/ppt/ 下已存在的导出文件（R4-AC2）。
      parameters:
        - $ref: '#/components/parameters/MaterialId'
        - name: asset_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 图片二进制
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/jobs/{job_id}:
    get:
      tags: [jobs]
      operationId: getJob
      summary: 任务状态（端点 #10）
      description: 前端每 2 秒轮询，stage 为 ready/failed 时停止（R3-AC5）。stage 迁移见 JobStage。
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: 任务状态
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/JobStatus'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/jobs/{job_id}/retry:
    post:
      tags: [jobs]
      operationId: retryJob
      summary: 显式重试生成新 attempt（端点 #11）
      description: 空体；失败的 PARSE_FAILED 可重试，attempt 递增后回到 queued（R3-AC4）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '202':
          description: 已受理重试
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RetryAccepted'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/objects/{object_id}:
    get:
      tags: [objects]
      operationId: getObject
      summary: 读取知识对象与最近校验摘要（端点 #12）
      description: 返回 object（C-KO@1）与 checks_summary（最近一次 ValidationReport，可为 null）。
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: 对象与校验摘要
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ObjectWithChecks'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/objects/{object_id}/model:
    put:
      tags: [objects]
      operationId: putObjectModel
      summary: 保存对象结构并推进 model_version（端点 #13）
      description: expected_version 与库中 model_version 不一致时返回 VERSION_CONFLICT（R10-AC6）；成功后 model_version+1、revision 归 0、旧校验报告置 stale（R5-AC4、§2.3.2）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutModelRequest'
      responses:
        '200':
          description: 已保存
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/ObjectEnvelope'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/objects/{object_id}/compile:
    post:
      tags: [objects]
      operationId: compileObject
      summary: 编译对象为可交互视图（端点 #14）
      description: 返回 202 与 job_id；任务按 compiling → validating → ready 迁移（§2.3.5）。template_id 不在白名单返回 UNSUPPORTED_TEMPLATE。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompileRequest'
      responses:
        '202':
          description: 已受理编译
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CompileAccepted'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/objects/{object_id}/runs:
    post:
      tags: [objects]
      operationId: createRun
      summary: 保存运行快照（端点 #15）
      description: 客户端可上传 result 用于对比，但服务端必须用内核重算并覆盖；响应里的 result 永远是服务端结果（§2.2.7 契约级行为 3）。版本或修订不一致返回 VERSION_CONFLICT（R10-AC6）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRunRequest'
      responses:
        '201':
          description: 运行已冻结
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: './schemas/run.schema.json'
        '404':
          $ref: '#/components/responses/Error404'
        '409':
          $ref: '#/components/responses/Error409'
        '422':
          $ref: '#/components/responses/Error422'
    get:
      tags: [objects]
      operationId: listRuns
      summary: 对象历史运行（端点 #16）
      description: 返回 RunSnapshot 列表；limit 默认 20、最大 50。
      parameters:
        - $ref: '#/components/parameters/ObjectId'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 20
      responses:
        '200':
          description: 运行列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/RunList'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/runs/{run_id}:
    get:
      tags: [runs]
      operationId: getRun
      summary: 读取单个运行快照（端点 #17）
      description: 回放只读取 input_snapshot，不被当前参数覆盖（R10-AC5）。
      parameters:
        - name: run_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: 运行快照
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: './schemas/run.schema.json'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/objects/{object_id}/validate:
    post:
      tags: [objects]
      operationId: validateObject
      summary: 同步执行独立校验（端点 #18）
      description: 首版同步执行并直接返回 ValidationReport，不建 job（§2.2.7 契约级行为 4、§2.3.7 D3）。
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateRequest'
      responses:
        '200':
          description: 校验报告
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: './schemas/run.schema.json#/$defs/ValidationReport'
        '404':
          $ref: '#/components/responses/Error404'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/objects/{object_id}/checks:
    get:
      tags: [objects]
      operationId: listObjectChecks
      summary: 对象历史校验报告（端点 #19）
      description: is_stale 在响应时按当前对象版本动态计算（R10-AC7、R11-AC4）。
      parameters:
        - $ref: '#/components/parameters/ObjectId'
      responses:
        '200':
          description: 报告列表
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/CheckList'
        '404':
          $ref: '#/components/responses/Error404'

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: registerAccount
      summary: 注册账号（C-AUTHAPI@1 ①）
      description: 匿名可调用；事务内写 users + 两条 login_identities（username/email），不下发 Cookie、不发邮件（开发期降级 email_verification=disabled_development）。用户名 3–20 位且不区分大小写唯一，密码长度 8–128，策略在服务层校验（违规 422 MISSING_FIELD）。写请求要求 Origin 在允许列表内，否则 422 MISSING_FIELD。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 账号已创建（email_verification=disabled_development）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthUser'
        '409':
          $ref: '#/components/responses/Error409Email'
        '422':
          $ref: '#/components/responses/Error422'
        '503':
          $ref: '#/components/responses/Error503'

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: loginAccount
      summary: 登录账号（C-AUTHAPI@1 ②）
      description: 校验用户名/邮箱与密码，签发 auth_sessions 并下发 HttpOnly Cookie（默认名 xs_auth）。标识不存在与密码错误统一 401 INVALID_CREDENTIALS；账号非 active 返回 403 FORBIDDEN；remember 决定窗口（普通 12h/24h，记住我 168h/720h）。写请求要求 Origin 在允许列表内，否则 422 MISSING_FIELD。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功并下发会话 Cookie
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              description: 'xs_auth=<43 字符原始令牌>; HttpOnly; Path=/; SameSite=Lax; Max-Age=(remember ? 2592000 : 86400)'
              schema:
                type: string
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '401':
          $ref: '#/components/responses/Error401Auth'
        '403':
          $ref: '#/components/responses/Error403'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logoutAccount
      summary: 退出登录（C-AUTHAPI@1 ③）
      description: 必须携带有效 xs_auth Cookie 与 X-CSRF-Token，Origin 须在允许列表内（校验顺序：Origin → 会话 → CSRF）。撤销会话并清除 Cookie；同一 Cookie 第二次调用返回 401（会话已撤销）。
      security:
        - authCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '204':
          description: 会话已撤销，Cookie 已清除（无响应体）
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/Error401Auth'
        '422':
          $ref: '#/components/responses/Error422'

  /api/v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: 读取当前账号（C-AUTHAPI@1 ④）
      description: 需有效 xs_auth Cookie。返回账号、会话摘要与当前会话 CSRF；允许按 5 分钟节流更新 last_seen_at。未登录返回 401 且 body 不含任何账号字段。
      security:
        - authCookie: []
      responses:
        '200':
          description: 当前账号与会话摘要
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Error401Auth'

