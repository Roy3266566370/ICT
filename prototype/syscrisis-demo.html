<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>万象 · 数字系统急诊室（SysCrisis Lab 独立概念原型）</title>
  <style>
    /* 沿用项目 tokens.css「纸上仪器 / Paper Instrument」视觉语言 */
    :root {
      --paper-0: #fbf9f2;
      --paper-1: #f6f3ea;
      --paper-2: #f2f0e8;
      --paper-3: #e9e5d9;
      --paper-4: #ddd8ca;

      --ink-900: #101211;
      --ink-700: #34372f;
      --ink-500: #5f6257;
      --ink-400: #7f8175;

      --hairline: #d8d3c4;
      --hairline-strong: #c5c0b0;

      --indigo: #1c2ecb;
      --indigo-soft: #e8e9f8;
      --coral: #de421f;
      --coral-ink: #ac2c10;
      --coral-soft: #fbe9e3;

      --pass: #0f7b5f;
      --pass-soft: #e4f3ed;
      --fail: #b42318;
      --fail-soft: #fbeae7;
      --warn: #9a5b08;
      --warn-soft: #fbf1de;

      --font-sans: 'Inter', 'HarmonyOS Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper-2);
      color: var(--ink-700);
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.55;
    }

    .mono {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
    }

    /* 顶部栏 */
    .topbar {
      background: var(--paper-0);
      border-bottom: 1px solid var(--hairline-strong);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 30px;
      height: 30px;
      background: var(--ink-900);
      color: var(--paper-0);
      display: grid;
      place-items: center;
      font-weight: 800;
      font-size: 14px;
      box-shadow: 3px 3px 0 var(--coral);
    }

    .brand-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink-900);
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--ink-500);
      font-family: var(--font-mono);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      padding: 4px 10px;
      border: 1px solid var(--hairline-strong);
      background: var(--paper-1);
      color: var(--ink-500);
    }

    .btn {
      appearance: none;
      border: 1px solid var(--ink-900);
      background: var(--paper-0);
      color: var(--ink-900);
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease, background 0.15s ease;
    }

    .btn:hover {
      background: var(--paper-3);
    }

    .btn:active {
      transform: translate(1px, 1px);
    }

    .btn-primary {
      background: var(--ink-900);
      color: var(--paper-0);
      box-shadow: 3px 3px 0 var(--coral);
    }

    .btn-primary:hover {
      background: #232724;
    }

    .btn-indigo {
      background: var(--indigo);
      border-color: var(--indigo);
      color: #fff;
    }

    .btn-indigo:hover {
      background: #14229e;
    }

    /* 主容器 */
    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 20px 36px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* AI 日志/题干编译栏 */
    .compiler-bar {
      background: var(--paper-0);
      border: 1px solid var(--hairline-strong);
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .compiler-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .compiler-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--ink-900);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .compiler-dot {
      width: 8px;
      height: 8px;
      background: var(--indigo);
      display: inline-block;
    }

    .quick-prompts {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      border: 1px solid var(--hairline-strong);
      background: var(--paper-1);
      color: var(--ink-700);
      padding: 3px 9px;
      font-size: 12px;
      cursor: pointer;
    }

    .chip:hover {
      border-color: var(--indigo);
      color: var(--indigo);
      background: var(--indigo-soft);
    }

    .compiler-input-row {
      display: flex;
      gap: 10px;
    }

    .compiler-input {
      flex: 1;
      border: 1px solid var(--hairline-strong);
      background: var(--paper-1);
      color: var(--ink-900);
      padding: 9px 12px;
      font-family: var(--font-sans);
      font-size: 13px;
    }

    .compiler-input:focus {
      outline: 2px solid var(--indigo);
      background: var(--paper-0);
    }

    .compiler-feedback {
      font-size: 12px;
      color: var(--indigo);
      font-family: var(--font-mono);
      display: none;
    }

    .compiler-feedback.is-visible {
      display: block;
    }

    /* 病例切换卡 */
    .case-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .case-tab {
      text-align: left;
      border: 1px solid var(--hairline-strong);
      background: var(--paper-0);
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
      position: relative;
    }

    .case-tab:hover {
      background: var(--paper-1);
    }

    .case-tab.is-active {
      border-color: var(--ink-900);
      box-shadow: 4px 4px 0 var(--ink-900);
      background: var(--paper-0);
    }

    .case-tab-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
    }

    .case-tab-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink-900);
    }

    .case-tab-desc {
      font-size: 12px;
      color: var(--ink-500);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border: 1px solid currentColor;
    }

    .status-fail {
      color: var(--fail);
      background: var(--fail-soft);
    }

    .status-warn {
      color: var(--warn);
      background: var(--warn-soft);
    }

    .status-pass {
      color: var(--pass);
      background: var(--pass-soft);
    }

    /* 三界同构主体 */
    .triptych {
      display: grid;
      grid-template-columns: 310px 1fr 340px;
      gap: 14px;
      align-items: stretch;
    }

    @media (max-width: 1160px) {
      .triptych {
        grid-template-columns: 1fr;
      }
      .case-tabs {
        grid-template-columns: 1fr;
      }
    }

    .pane {
      background: var(--paper-0);
      border: 1px solid var(--hairline-strong);
      display: flex;
      flex-direction: column;
      min-height: 540px;
    }

    .pane-header {
      padding: 10px 14px;
      background: var(--paper-1);
      border-bottom: 1px solid var(--hairline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .pane-kicker {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-500);
      letter-spacing: 0.05em;
    }

    .pane-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    /* 左界：监控告警 */
    .health-banner {
      padding: 12px;
      border: 1px solid currentColor;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .health-banner strong {
      font-size: 14px;
    }

    .health-banner span {
      font-size: 12px;
    }

    .kpi-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .kpi-card {
      background: var(--paper-1);
      border: 1px solid var(--hairline);
      padding: 10px;
    }

    .kpi-label {
      font-size: 11px;
      color: var(--ink-500);
    }

    .kpi-val {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 800;
      color: var(--ink-900);
      margin-top: 2px;
    }

    .kpi-delta {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-500);
    }

    .log-box {
      background: #141715;
      color: #d9dfd9;
      font-family: var(--font-mono);
      font-size: 11.5px;
      padding: 10px 12px;
      line-height: 1.55;
      border: 1px solid var(--ink-900);
      flex: 1;
      overflow-y: auto;
      max-height: 240px;
    }

    .log-line-err { color: #ff7b72; }
    .log-line-warn { color: #f2cc60; }
    .log-line-ok { color: #56d364; }
    .log-line-dim { color: #8b949e; }

    /* 中界：病理透视镜 */
    .xray-stage {
      background: var(--paper-1);
      border: 1px solid var(--hairline);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      flex: 1;
    }

    .xray-formula-bar {
      background: var(--paper-0);
      border: 1px solid var(--hairline);
      padding: 8px 12px;
      font-family: var(--font-mono);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .xray-canvas-wrap {
      background: var(--paper-0);
      border: 1px solid var(--hairline);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .timeline-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--paper-0);
      border: 1px solid var(--hairline);
      padding: 8px 12px;
    }

    .timeline-row input[type="range"] {
      flex: 1;
      accent-color: var(--indigo);
    }

    /* 病例1：页面置换矩阵 */
    .frame-table-wrap {
      overflow-x: auto;
    }

    .frame-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--font-mono);
      font-size: 12px;
      text-align: center;
    }

    .frame-table th, .frame-table td {
      border: 1px solid var(--hairline);
      padding: 5px 4px;
      min-width: 30px;
    }

    .frame-table th {
      background: var(--paper-2);
      color: var(--ink-900);
    }

    .frame-table td.is-cur {
      outline: 2px solid var(--indigo);
      outline-offset: -2px;
      background: var(--indigo-soft);
    }

    .cell-miss {
      background: var(--fail-soft);
      color: var(--fail);
      font-weight: 700;
    }

    .cell-hit {
      background: var(--pass-soft);
      color: var(--pass);
      font-weight: 700;
    }

    /* 右界：手术台与 AI 导师 */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
      background: var(--paper-1);
      border: 1px solid var(--hairline);
    }

    .control-label {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--ink-900);
    }

    .control-group select,
    .control-group input[type="text"],
    .control-group input[type="range"] {
      width: 100%;
    }

    .control-group select,
    .control-group input[type="text"] {
      border: 1px solid var(--hairline-strong);
      background: var(--paper-0);
      padding: 6px 8px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--ink-900);
    }

    .control-group input[type="range"] {
      accent-color: var(--coral);
    }

    .ai-box {
      border: 1px solid var(--indigo);
      background: var(--indigo-softer, #f2f2fa);
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: auto;
    }

    .ai-box-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 700;
      color: var(--indigo);
    }

    .ai-msg {
      font-size: 12.5px;
      color: var(--ink-700);
      line-height: 1.55;
    }

    .verdict-box {
      border: 1px solid var(--hairline-strong);
      background: var(--paper-1);
      padding: 10px 12px;
      font-size: 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 弹窗 */
    dialog {
      border: 1px solid var(--ink-900);
      background: var(--paper-0);
      color: var(--ink-900);
      box-shadow: 8px 8px 0 var(--ink-900);
      max-width: 620px;
      width: calc(100% - 32px);
      padding: 0;
    }

    dialog::backdrop {
      background: rgba(16, 18, 17, 0.48);
    }

    .modal-head {
      padding: 14px 18px;
      background: var(--paper-1);
      border-bottom: 1px solid var(--hairline-strong);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .compare-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .compare-table th, .compare-table td {
      border: 1px solid var(--hairline);
      padding: 8px 10px;
      text-align: left;
    }

    .compare-table th {
      background: var(--paper-1);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">万</div>
      <div>
        <div class="brand-title">万象 · 数字系统急诊室 <span class="mono" style="font-weight:400;font-size:12px;color:var(--ink-500);">SysCrisis Lab</span></div>
        <div class="brand-sub">独立交互概念原型 · 408 与高数内核直接驱动真实工程排障（零改原项目代码）</div>
      </div>
    </div>
    <div class="top-actions">
      <span class="pill-badge">确定性内核裁决 · 非静态写死结果</span>
      <button class="btn" id="btn-chaos" type="button">注入随机突发故障</button>
      <button class="btn btn-primary" id="btn-report" type="button">生成急救复盘单</button>
    </div>
  </header>

  <main class="shell">
    <!-- 模拟 MaaS 自由日志/题干编译栏 -->
    <section class="compiler-bar" aria-label="故障日志与原题编译器">
      <div class="compiler-head">
        <div class="compiler-title">
          <span class="compiler-dot"></span>
          故障日志 / 传统课本原题 &rarr; 一键编译为可抢救系统沙盒（模拟 MaaS Schema 解析）
        </div>
        <div class="quick-prompts">
          <span style="font-size:12px;color:var(--ink-500);">快捷示例：</span>
          <button class="chip" data-sample="belady">示例1: 内存扩到4页后反更卡</button>
          <button class="chip" data-sample="grad">示例2: 模型训练 Step8 Loss=NaN</button>
          <button class="chip" data-sample="net">示例3: 千兆专线只跑出2%吞吐</button>
          <button class="chip" data-sample="wrap">示例4: 408原题“SR窗口40用6bit序号”</button>
        </div>
      </div>
      <div class="compiler-input-row">
        <input
          id="compiler-input"
          class="compiler-input"
          type="text"
          placeholder="粘贴一段真实服务器报错、PyTorch 训练异常，或一道枯燥的 408/高数题干……"
        />
        <button id="btn-compile" class="btn btn-indigo" type="button">编译进急诊室</button>
      </div>
      <div id="compiler-feedback" class="compiler-feedback"></div>
    </section>

    <!-- 三大病例切换 -->
    <section class="case-tabs" role="tablist" aria-label="急诊病例">
      <button class="case-tab is-active" role="tab" data-case="os" type="button">
        <div class="case-tab-top">
          <span>CASE 01 · OS 虚拟内存</span>
          <span class="status-pill status-fail" id="tab-badge-os">ALARM</span>
        </div>
        <div class="case-tab-title">内存加到 4 页框，服务器反而更卡死</div>
        <div class="case-tab-desc">复用 opsys 内核：Belady 异常透视 &amp; 置换策略手术</div>
      </button>

      <button class="case-tab" role="tab" data-case="math" type="button">
        <div class="case-tab-top">
          <span>CASE 02 · 最优化 × 线代条件数</span>
          <span class="status-pill status-fail" id="tab-badge-math">ALARM</span>
        </div>
        <div class="case-tab-title">AI 模型训练第 8 步 Loss 突然飞天 NaN</div>
        <div class="case-tab-desc">复用优化/线代内核：条件数 &kappa;(H) 狭谷与学习率红线</div>
      </button>

      <button class="case-tab" role="tab" data-case="net" type="button">
        <div class="case-tab-top">
          <span>CASE 03 · 计算机网络管道与序号</span>
          <span class="status-pill status-fail" id="tab-badge-net">ALARM</span>
        </div>
        <div class="case-tab-title">跨海专线吞吐黑洞 &amp; 序号回绕丢帧</div>
        <div class="case-tab-desc">复用计网内核：时延带宽积 BDP 与滑动窗口序号铁律</div>
      </button>
    </section>

    <!-- 三界同构主舞台 -->
    <section class="triptych">
      <!-- 左界：工程故障现场 -->
      <article class="pane">
        <header class="pane-header">
          <span class="pane-kicker">01 · SYSTEM MONITOR（工程故障现场）</span>
          <span class="status-pill status-fail" id="left-status-pill">CRITICAL</span>
        </header>
        <div class="pane-body" id="left-pane-body"></div>
      </article>

      <!-- 中界：病理透视镜 -->
      <article class="pane">
        <header class="pane-header">
          <span class="pane-kicker">02 · X-RAY KERNEL（底层原理透视镜）</span>
          <span class="mono" style="font-size:11px;color:var(--ink-500);" id="xray-kernel-tag">engine: page_replace_v1</span>
        </header>
        <div class="pane-body" id="center-pane-body"></div>
      </article>

      <!-- 右界：手术台与带教 AI -->
      <article class="pane">
        <header class="pane-header">
          <span class="pane-kicker">03 · SURGERY &amp; AI MENTOR（手术调参台）</span>
          <button class="btn" id="btn-reset-case" type="button" style="padding:3px 9px;font-size:11px;">恢复崩溃现场</button>
        </header>
        <div class="pane-body" id="right-pane-body"></div>
      </article>
    </section>
  </main>

  <!-- 复盘对比单弹窗 -->
  <dialog id="report-dialog">
    <div class="modal-head">
      <div>
        <strong style="font-size:15px;">《系统故障急诊与底层原理溯源单》</strong>
        <div class="mono" style="font-size:11px;color:var(--ink-500);" id="report-hash"></div>
      </div>
      <button class="btn" id="btn-close-report" type="button">关闭</button>
    </div>
    <div class="modal-body" id="report-body"></div>
  </dialog>

  <script>
    /**
     * 独立概念原型：所有计算均为前端真实确定性算法执行，可任意修改参数实时重算。
     */

    const state = {
      activeCase: 'os',
      os: {
        algo: 'fifo',
        frames: 4,
        seqText: '1,2,3,4,1,2,5,1,2,3,4,5',
        step: 11,
        baseline: { algo: 'fifo', frames: 4, faults: 10, latency: 184 }
      },
      math: {
        a: 20,      // w1 方向曲率（未归一化时陡峭）
        b: 0.5,     // w2 方向曲率
        lr: 0.11,   // 初始超过 2/a = 0.10 引发梯度爆炸
        step: 15,
        baseline: { a: 20, lr: 0.11 }
      },
      net: {
        proto: 'gbn',
        window: 4,
        seqBits: 5,
        lossMode: 'none',
        baseline: { proto: 'gbn', window: 4, seqBits: 5 }
      }
    };

    /* ======================== 1. 真实 OS 页面置换内核 ======================== */
    function runPageReplace(seq, framesCount, algo) {
      const n = seq.length;
      const frames = [];
      const snapshots = [];
      let faults = 0;
      let hits = 0;
      const fifoQueue = [];
      const lruOrder = [];
      let clockPtr = 0;
      const refBits = new Map();

      for (let i = 0; i < n; i++) {
        const page = seq[i];
        const idx = frames.indexOf(page);
        let hit = false;
        let evicted = null;

        if (idx !== -1) {
          hit = true;
          hits++;
          if (algo === 'lru') {
            const p = lruOrder.indexOf(page);
            if (p !== -1) lruOrder.splice(p, 1);
            lruOrder.push(page);
          } else if (algo === 'clock') {
            refBits.set(page, 1);
          }
        } else {
          faults++;
          if (frames.length < framesCount) {
            frames.push(page);
            fifoQueue.push(page);
            lruOrder.push(page);
            refBits.set(page, 1);
          } else {
            let victim = frames[0];
            if (algo === 'fifo') {
              victim = fifoQueue.shift();
              fifoQueue.push(page);
            } else if (algo === 'lru') {
              victim = lruOrder.shift();
              lruOrder.push(page);
            } else if (algo === 'opt') {
              let farthest = -1;
              for (const f of frames) {
                const nextUse = seq.indexOf(f, i + 1);
                if (nextUse === -1) {
                  victim = f;
                  break;
                }
                if (nextUse > farthest) {
                  farthest = nextUse;
                  victim = f;
                }
              }
            } else if (algo === 'clock') {
              while (true) {
                const cand = frames[clockPtr % frames.length];
                if ((refBits.get(cand) || 0) === 0) {
                  victim = cand;
                  break;
                }
                refBits.set(cand, 0);
                clockPtr = (clockPtr + 1) % frames.length;
              }
            }
            evicted = victim;
            const replaceIdx = frames.indexOf(victim);
            frames[replaceIdx] = page;
            if (algo === 'clock') {
              refBits.delete(victim);
              refBits.set(page, 1);
              clockPtr = (replaceIdx + 1) % frames.length;
            }
          }
        }

        snapshots.push({
          step: i,
          page,
          hit,
          evicted,
          frames: [...frames]
        });
      }

      return {
        faults,
        hits,
        total: n,
        rate: n ? faults / n : 0,
        snapshots
      };
    }

    function evaluateOsCase() {
      const raw = state.os.seqText
        .split(/[,，\s]+/)
        .map(s => s.trim())
        .filter(Boolean)
        .slice(0, 24);
      const seq = raw.length ? raw : ['1','2','3','4','1','2','5','1','2','3','4','5'];
      const cur = runPageReplace(seq, state.os.frames, state.os.algo);
      const prevFrameCount = Math.max(1, state.os.frames - 1);
      const prev = runPageReplace(seq, prevFrameCount, state.os.algo);

      // 计算 1..6 帧曲线以检测 Belady 异常
      const series = [];
      let hasBelady = false;
      for (let f = 1; f <= 6; f++) {
        const r = runPageReplace(seq, f, state.os.algo);
        series.push({ frames: f, faults: r.faults });
        if (f > 1 && r.faults > series[f - 2].faults) {
          hasBelady = true;
        }
      }

      // 模拟系统 P99 延迟（ms）与健康评估
      const faultPenalty = cur.rate * 160;
      const baseLatency = 52;
      const latency = Math.round(baseLatency + faultPenalty);
      const beladyTriggeredHere = state.os.frames > 1 && cur.faults > prev.faults;

      let status = 'pass';
      let headline = '内存子系统已稳定恢复';
      let summary = `当前缺页率 ${(cur.rate * 100).toFixed(1)}%（${cur.faults}/${cur.total}），扩容收益单调正常，P99 延迟回落至 ${latency} ms。`;

      if (beladyTriggeredHere) {
        status = 'fail';
        headline = '触发 Belady 异常：扩容反而更卡死！';
        summary = `物理块从 ${prevFrameCount} 增至 ${state.os.frames} 时，${state.os.algo.toUpperCase()} 缺页从 ${prev.faults} 次反升至 ${cur.faults} 次！`;
      } else if (cur.rate > 0.68) {
        status = 'warn';
        headline = '缺页率偏高：仍存在缓存抖动风险';
        summary = `虽然未触发扩容逆增长，但缺页率仍达 ${(cur.rate * 100).toFixed(1)}%，建议换用局部性更优的置换策略或增大物理页框。`;
      }

      return { seq, cur, prev, prevFrameCount, series, hasBelady, beladyTriggeredHere, latency, status, headline, summary };
    }

    /* ======================== 2. 真实梯度下降 & 条件数内核 ======================== */
    function evaluateMathCase() {
      const { a, b, lr } = state.math;
      const maxSteps = 18;
      let w1 = 1.6;
      let w2 = 3.8;
      const path = [];
      let exploded = false;

      const lossFn = (x, y) => 0.5 * (a * x * x + b * y * y);

      for (let k = 0; k <= maxSteps; k++) {
        const loss = lossFn(w1, w2);
        const g1 = a * w1;
        const g2 = b * w2;
        const gradNorm = Math.hypot(g1, g2);
        path.push({ k, w1, w2, loss, gradNorm });
        if (!Number.isFinite(loss) || loss > 1e5) {
          exploded = true;
          break;
        }
        w1 = w1 - lr * g1;
        w2 = w2 - lr * g2;
      }

      const lambdaMax = Math.max(a, b);
      const lambdaMin = Math.min(a, b);
      const kappa = lambdaMax / lambdaMin;
      const lrLimit = 2 / lambdaMax;
      const finalPt = path[path.length - 1];
      const diverging = exploded || finalPt.loss > path[0].loss * 1.1;

      let status = 'pass';
      let headline = '训练已安全收敛至全局最优点';
      let summary = `条件数 κ(H) = ${kappa.toFixed(1)}，学习率 η = ${lr.toFixed(3)} < 红线 ${lrLimit.toFixed(3)}，${maxSteps} 步内 Loss 降至 ${finalPt.loss.toFixed(4)}。`;

      if (diverging) {
        status = 'fail';
        headline = '梯度爆炸发散：突破数学稳定红线！';
        summary = `学习率 η=${lr.toFixed(3)} 超过了最大稳定边界 2/λ_max=${lrLimit.toFixed(3)}，每步沿陡壁越界弹飞（Loss 飙至 ${finalPt.loss > 9999 ? '∞ (NaN)' : finalPt.loss.toFixed(1)}）。`;
      } else if (finalPt.loss > 0.08) {
        status = 'warn';
        headline = '虽未爆炸，但地形病态导致收敛龟速';
        summary = `只调小学习率避开了爆炸，但条件数 κ(H)=${kappa.toFixed(1)} 过高，w₂ 平坦方向爬行极慢，最终 Loss 仍停在 ${finalPt.loss.toFixed(3)}（目标 < 0.08）。`;
      }

      return { path, kappa, lrLimit, finalPt, diverging, status, headline, summary };
    }

    /* ======================== 3. 真实网络 BDP & 序号空间内核 ======================== */
    function evaluateNetCase() {
      const { proto, window: winRaw, seqBits } = state.net;
      const bandwidthMbps = 10;
      const rttMs = 80;
      const frameBytes = 1000;
      const tfMs = (frameBytes * 8) / (bandwidthMbps * 1e6) * 1000; // 0.8 ms
      const bdpFrames = Math.ceil((rttMs + tfMs) / tfMs); // 101 帧

      const effectiveW = proto === 'sw' ? 1 : winRaw;
      const seqSpace = Math.pow(2, seqBits);
      const maxSafeW = proto === 'sw' ? 1 : proto === 'gbn' ? seqSpace - 1 : Math.floor(seqSpace / 2);
      const wrapViolation = effectiveW > maxSafeW;

      const rawUtil = Math.min(1, (effectiveW * tfMs) / (rttMs + tfMs));
      const throughputMbps = wrapViolation ? 0.12 : bandwidthMbps * rawUtil;
      const effectiveUtil = wrapViolation ? 0.012 : rawUtil;

      let status = 'pass';
      let headline = '跨海专线管道已健康满载运行';
      let summary = `序号空间 ${seqSpace} 满足 ${proto.toUpperCase()} 安全上限（W=${effectiveW} ≤ ${maxSafeW}），信道利用率 ${(effectiveUtil * 100).toFixed(1)}%，吞吐达 ${throughputMbps.toFixed(2)} Mbps。`;

      if (wrapViolation) {
        status = 'fail';
        const rule = proto === 'gbn' ? `2^k ≥ W + 1（当前上限 ${seqSpace - 1}）` : `2^k ≥ 2W（当前上限 ${Math.floor(seqSpace / 2)}）`;
        headline = '序号空间回绕崩溃：新旧帧产生静默歧义！';
        summary = `${proto.toUpperCase()} 协议要求 ${rule}，但当前 W=${effectiveW} 越界！接收方将新帧误判为历史重复帧并丢弃，应用层吞吐跌穿！`;
      } else if (effectiveUtil < 0.12) {
        status = 'fail';
        headline = '严重带宽黑洞：链路利用率不足 12%！';
        summary = `管道容量（时延带宽积）达 ${bdpFrames} 帧，当前发送窗口仅 W=${effectiveW}，吞吐低至 ${throughputMbps.toFixed(2)} Mbps，专线几乎完全空转。`;
      } else if (effectiveUtil < 0.55) {
        status = 'warn';
        headline = '管道半饥饿：仍有明显带宽浪费';
        summary = `一条管道容量（时延带宽积）可容纳 ${bdpFrames} 帧，当前发送窗口仅 W=${effectiveW}，信道利用率只有 ${(effectiveUtil * 100).toFixed(1)}%。`;
      }

      return { bandwidthMbps, rttMs, frameBytes, tfMs, bdpFrames, effectiveW, seqSpace, maxSafeW, wrapViolation, effectiveUtil, throughputMbps, status, headline, summary };
    }

    /* ======================== 渲染主调度 ======================== */
    function statusMeta(status) {
      if (status === 'pass') return { cls: 'status-pass', label: 'HEALTHY · 绿灯' };
      if (status === 'warn') return { cls: 'status-warn', label: 'DEGRADED · 黄灯' };
      return { cls: 'status-fail', label: 'CRITICAL · 红灯' };
    }

    function renderAll() {
      const osEval = evaluateOsCase();
      const mathEval = evaluateMathCase();
      const netEval = evaluateNetCase();

      updateBadge('tab-badge-os', osEval.status);
      updateBadge('tab-badge-math', mathEval.status);
      updateBadge('tab-badge-net', netEval.status);

      document.querySelectorAll('.case-tab').forEach(btn => {
        btn.classList.toggle('is-active', btn.dataset.case === state.activeCase);
      });

      if (state.activeCase === 'os') renderOsViews(osEval);
      else if (state.activeCase === 'math') renderMathViews(mathEval);
      else renderNetViews(netEval);
    }

    function updateBadge(id, status) {
      const el = document.getElementById(id);

      el.className = `status-pill ${m.cls}`;
      el.textContent = status === 'pass' ? 'HEALTHY' : status === 'warn' ? 'DEGRADED' : 'ALARM';
    }

          ${ev.diverging
            ? `<div class="log-line-err">[FATAL] FloatingPointOverflow: 步长超越稳定上界 2/λ_max=${ev.lrLimit.toFixed(3)}!</div>`

      `;

      // 中界：绘制二维等高线与梯度迭代轨迹 SVG
      const W = 520, H = 300;
      const maxX = 4.5, maxY = 4.5;
      const toSx = x => W / 2 + (x / maxX) * (W / 2 - 20);
      const toSy = y => H / 2 - (y / maxY) * (H / 2 - 20);
      const scaleX = (W / 2 - 20) / maxX;
      const scaleY = (H / 2 - 20) / maxY;

      const levels = [2, 8, 22, 50];
      const ellipses = levels.map(c => {
        const rx = Math.sqrt(2 * c / state.math.a) * scaleX;
        const ry = Math.sqrt(2 * c / state.math.b) * scaleY;
        return `<ellipse cx="${W/2}" cy="${H/2}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" fill="none" stroke="#c5c0b0" stroke-dasharray="3 3" />`;
      }).join('');

      const visLen = Math.min(state.math.step + 1, ev.path.length);
      const visPts = ev.path.slice(0, visLen);
      const lineCoords = visPts.map(p => `${toSx(Math.max(-6, Math.min(6, p.w1))).toFixed(1)},${toSy(Math.max(-6, Math.min(6, p.w2))).toFixed(1)}`).join(' ');

                const cx = toSx(Math.max(-6, Math.min(6, p.w1)));
                const cy = toSy(Math.max(-6, Math.min(6, p.w2)));
                return `<circle cx="${cx}" cy="${cy}" r="${idx === visPts.length - 1 ? 5 : 3}" fill="${idx === 0 ? '#1c2ecb' : ev.diverging ? '#b42318' : '#de421f'}" />`;

    /* ---------- 渲染病例 3：计算机网络 BDP & 序号空间 ---------- */

              <span class="mono" style="position:absolute;right:8px;top:9px;font-size:11px;color:var(--ink-900);">

      if (ev.status === 'pass') {
        mentorHint = '✅ 抢救完成！既通过足够大的窗口填满了跨海高时延管道（克服 BDP 瓶颈），又留足了序号比特空间防回绕。';
      } else if (ev.wrapViolation) {

    /* ======================== 交互绑定：病例切换、日志编译、混沌注错、复盘单 ======================== */
    document.querySelectorAll('.case-tab').forEach(btn => {

      });

    const SAMPLES = {
      belady: '集群把物理块从 3 扩容到 4 块后，FIFO 缺页从 9 次暴涨到 10 次，序列 1,2,3,4,1,2,5,1,2,3,4,5',

    document.getElementById('btn-compile').addEventListener('click', () => {

    });

    function compilePrompt(text) {
      const t = (text || '').trim();
      const fb = document.getElementById('compiler-feedback');
      if (!t) return;

      if (/NaN|梯度|Loss|lr|特征|条件数|优化/i.test(t)) {
        state.activeCase = 'math';
        const lrMatch = t.match(/lr\s*=\s*([0-9.]+)/i);
        const aMatch = t.match(/a\s*=\s*([0-9.]+)/i);
        if (lrMatch) state.math.lr = Math.min(0.8, Math.max(0.01, Number(lrMatch[1])));
        if (aMatch) state.math.a = Math.min(24, Math.max(0.5, Number(aMatch[1])));
        fb.textContent = `✓ 已结构化提取模型参数 [kernel=optim.gd_2d, a=${state.math.a}, lr=${state.math.lr}] -> 并还原训练事故现场`;
      } else if (/SR|GBN|窗口|bit|Mbps|RTT|吞吐|序号/i.test(t)) {
        state.activeCase = 'net';
        if (/SR|选择重传/i.test(t)) state.net.proto = 'sr';
        else if (/GBN|回退/i.test(t)) state.net.proto = 'gbn';
        const wMatch = t.match(/(?:W|窗口)[^\d]{0,4}(\d+)/i);
        const bMatch = t.match(/(\d+)\s*bit/i);
        if (wMatch) state.net.window = Math.min(110, Math.max(1, Number(wMatch[1])));
        if (bMatch) state.net.seqBits = Math.min(9, Math.max(3, Number(bMatch[1])));
        fb.textContent = `✓ 已结构化提取网络条件 [kernel=network.sliding_window, proto=${state.net.proto.toUpperCase()}, W=${state.net.window}, k=${state.net.seqBits}bit] -> 立即检验是否发生回绕`;
      } else {
        state.activeCase = 'os';
        const seqMatch = t.match(/(\d+(?:[,，\s]+\d+){4,})/);
        if (seqMatch) state.os.seqText = seqMatch[1].replace(/，|\s+/g, ',');
        const fMatch = t.match(/(\d+)\s*(?:块|帧)/);
        if (fMatch) state.os.frames = Math.min(6, Math.max(2, Number(fMatch[1])));
        if (/FIFO/i.test(t)) state.os.algo = 'fifo';
        fb.textContent = `✓ 已结构化提取内存现场 [kernel=opsys.page_replace, algo=${state.os.algo.toUpperCase()}, frames=${state.os.frames}] -> 已还原监控现场`;
      }
      fb.classList.add('is-visible');
      renderAll();
    }

            ${rowHtml('CASE 01 · OS 虚拟内存', 'FIFO 4帧 · 缺页 10 次 (184ms)', `${state.os.algo.toUpperCase()} ${state.os.frames}帧 · 缺页 ${osEv.cur.faults} 次 (${osEv.latency}ms)`, osEv.status)}
            ${rowHtml('CASE 02 · 训练梯度爆炸', 'a=20, lr=0.11 · Loss→NaN', `a=${state.math.a}, κ=${mathEv.kappa.toFixed(1)}, lr=${state.math.lr} · Loss=${mathEv.finalPt.loss > 9999 ? 'NaN' : mathEv.finalPt.loss.toFixed(4)}`, mathEv.status)}
            ${rowHtml('CASE 03 · 跨海链路黑洞', 'GBN W=4, 5bit · 吞吐 0.39Mbps', `${state.net.proto.toUpperCase()} W=${netEv.effectiveW}, ${state.net.seqBits}bit · 吞吐 ${netEv.throughputMbps.toFixed(2)}Mbps`, netEv.status)}
          </tbody>
        </table>
      `;
      dlg.showModal();
    });

    document.getElementById('btn-close-report').addEventListener('click', () => {
      document.getElementById('report-dialog').close();
    });

    renderAll();
  </script>
</body>
</html>
