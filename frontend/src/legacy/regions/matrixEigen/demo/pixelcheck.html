<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>pixelcheck</title>
  </head>
  <body>
    <pre id="out">pending</pre>
    <script>
      /**
       * 像素统计（验收用）：统计激活态截图里橙色 / 藏青 / 浅色虚线的像素数。
       *
       * 用法：
       *   http://localhost:5199/src/regions/matrixEigen/demo/pixelcheck.html?img=s06_workbench.png&x=100&y=120&w=600&h=420
       * 无裁剪参数时统计整图。
       */
      (async () => {
        const out = document.getElementById('out');
        try {
          const params = new URLSearchParams(location.search);
          const img = new URL(params.get('img') ?? 's06_workbench.png', location.href).href;
          const response = await fetch(img);
          const blob = await response.blob();
          const bitmap = await createImageBitmap(blob);
          const x = Number(params.get('x') ?? 0);
          const y = Number(params.get('y') ?? 0);
          const w = Number(params.get('w') ?? bitmap.width);
          const h = Number(params.get('h') ?? bitmap.height);
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          ctx.drawImage(bitmap, x, y, w, h, 0, 0, w, h);
          const data = ctx.getImageData(0, 0, w, h).data;
          let orange = 0;
          let navy = 0;
          let ghost = 0;
          let dark = 0;
          for (let i = 0; i < data.length; i += 4) {
            const r = data[i];
            const g = data[i + 1];
            const b = data[i + 2];
            // #C4622D 及其抗锯齿过渡色
            if (r >= 140 && r - g >= 50 && g - b >= 15 && b <= 110) orange += 1;
            // #16233A / #1B2A44 一类深藏青
            else if (r <= 70 && g <= 80 && b <= 110 && b - r >= 18) navy += 1;
            // #93A1B8 一类浅灰蓝（原像虚线）
            else if (r >= 120 && r <= 190 && b - r >= 15 && g >= 110 && b >= 140) ghost += 1;
            if (r <= 90 && g <= 100 && b <= 130) dark += 1;
          }
          const total = w * h;
          out.textContent = `img=${params.get('img')} crop=${x},${y},${w},${h} size=${w}x${h} orange=${orange} navy=${navy} ghost=${ghost} dark=${dark} total=${total}`;
          document.title = out.textContent;
        } catch (error) {
          out.textContent = `ERROR ${String(error)}`;
          document.title = out.textContent;
        }
      })();
    </script>
  </body>
</html>
